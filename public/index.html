<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1c27">
<title>ClientRadar</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<header>
  <h1>ClientRadar</h1>
  <span class="badge high">LIVE DATA</span>
</header>
<main>
  <p id="msg" class="muted"></p>

  <section id="dashboard" class="view active">
    <div id="stats" class="grid"></div>
    <div class="card">
      <h2>Scanner</h2>
      <p id="scanner">Loading...</p>
      <button id="scan-now" class="btn">Scan now</button>
    </div>
  </section>

  <section id="feed" class="view">
    <div class="filters">
      <select id="f-intent" aria-label="Intent">
        <option value="all">All intents</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <select id="f-cat" aria-label="Service category"></select>
      <select id="f-status" aria-label="Status">
        <option value="new">New</option>
        <option value="all">All posts</option>
        <option value="read">Read</option>
        <option value="saved">Saved</option>
      </select>
      <select id="f-date" aria-label="Date range">
        <option value="all">Any time</option>
        <option value="24">Last 24 hours</option>
        <option value="168">Last 7 days</option>
      </select>
    </div>
    <button id="mark-all" class="btn" style="margin-bottom:12px">Mark all as read</button>
    <div id="cards"></div>
  </section>

  <section id="settings" class="view">
    <div class="card">
      <h2>Admin token</h2>
      <label for="tok">Paste your admin token (saved on this phone only)</label>
      <input id="tok" type="password" autocomplete="off">
      <button id="save-token" class="btn">Save token</button>
    </div>
    <div class="card">
      <h2>This device</h2>
      <label for="dev-name">Device name (shown in the admin panel)</label>
      <input id="dev-name" type="text" maxlength="60" placeholder="Example: Asher's phone" autocomplete="off">
      <button id="save-dev" class="btn">Save device name</button>
      <p class="muted"><a href="admin.html">Open admin panel</a></p>
    </div>
    <div class="card">
      <h2>Search settings</h2>
      <label for="kw">Keywords (one per line)</label>
      <textarea id="kw" rows="8"></textarea>
      <label for="ex">Excluded phrases (one per line)</label>
      <textarea id="ex" rows="5"></textarea>
      <label for="min">Minimum intent score</label>
      <input id="min" type="number" min="0" max="20" value="4">
      <button id="save-settings" class="btn">Save settings</button>
    </div>
    <div class="card">
      <h2>Notifications</h2>
      <p>Permission: <strong id="perm"></strong></p>
      <div class="actions">
        <button id="enable-push" class="btn">Enable notifications</button>
        <button id="test-push" class="btn">Send test now</button>
        <button id="test-push-delay" class="btn">Test in 15 seconds</button>
      </div>
      <p id="push-msg" class="muted"></p>
    </div>
  </section>

  <section id="activity" class="view">
    <div id="runs"></div>
  </section>
</main>
<nav>
  <button data-view="dashboard" class="active">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    Dashboard
  </button>
  <button data-view="feed">
    <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="13" y2="18"/></svg>
    Feed
  </button>
  <button data-view="settings">
    <svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.5"/><circle cx="15" cy="17" r="2.5"/></svg>
    Settings
  </button>
  <button data-view="activity">
    <svg viewBox="0 0 24 24"><polyline points="3,12 7,12 10,5 14,19 17,12 21,12"/></svg>
    Activity
  </button>
</nav>
<script src="app.js"></script>
</body>
</html>
