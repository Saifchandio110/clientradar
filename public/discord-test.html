<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClientRadar: Discord detection test</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><h1>Discord test</h1><a href="index.html" class="handle">Back to app</a></header>
<main>
  <div class="card">
    <h2>Try a Discord message</h2>
    <p class="muted">This only scores the text you type. It never connects to Discord.</p>
    <label for="tok">Admin token</label>
    <input id="tok" type="password" autocomplete="off">
    <label for="msg">Message</label>
    <textarea id="msg" rows="3">Looking for an artist to draw my OC.</textarea>
    <label for="ch">Channel name (optional, e.g. commission-requests)</label>
    <input id="ch" autocomplete="off">
    <button id="go" class="btn">Score it</button>
    <p id="status" class="muted"></p>
  </div>
  <div id="out"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
$("#tok").value = localStorage.getItem("cr_token") || "";
$("#go").addEventListener("click", async () => {
  const token = $("#tok").value.trim();
  if (!token) { $("#status").textContent = "Enter your admin token first."; return; }
  localStorage.setItem("cr_token", token);
  $("#status").textContent = "Scoring...";
  try {
    const res = await fetch("/api/discord/score-test", {
      method: "POST",
      headers: { "x-admin-token": token, "content-type": "application/json" },
      body: JSON.stringify({ text: $("#msg").value, channel: $("#ch").value })
    });
    const d = await res.json();
    if (!res.ok) { $("#status").textContent = "FAILED (HTTP " + res.status + "): " + (d.error || "unknown"); return; }
    $("#status").textContent = "";
    const card = document.createElement("div");
    card.className = "card";
    const verdict = document.createElement("h2");
    if (d.skip) verdict.textContent = "Ignored: " + d.reason;
    else verdict.textContent = (d.qualifies ? "Would be saved: " : "Would NOT be saved: ") + d.intent.toUpperCase() + " (score " + d.score + ")";
    card.append(verdict);
    if (!d.skip) {
      const meta = document.createElement("p");
      meta.className = "muted";
      meta.textContent = "Category: " + d.category + " | Payment: " + d.pay_signal;
      const why = document.createElement("div");
      why.className = "reasons";
      why.textContent = "Why: " + d.reasons.join(", ");
      card.append(meta, why);
    }
    $("#out").replaceChildren(card);
  } catch (e) { $("#status").textContent = "FAILED: could not reach the server."; }
});
</script>
</body>
</html>
