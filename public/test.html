<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClientRadar: Bluesky search test</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Search test</h1>
  <a href="index.html" class="handle">Back to app</a>
</header>
<main>
  <div class="card">
    <h2>Live Bluesky search (real public posts)</h2>
    <label for="q">Search phrase</label>
    <input id="q" value="looking to commission">
    <div class="actions">
      <button id="go" class="btn">Search Bluesky</button>
      <button id="more" class="btn" disabled>Load more</button>
    </div>
    <p id="status" class="muted">Not searched yet.</p>
  </div>
  <div id="results"></div>
</main>
<script type="module">
import { searchPosts } from "./bluesky.js";
const $ = (s) => document.querySelector(s);
let cursor = null, count = 0;

function card(p) {
  const d = document.createElement("div");
  d.className = "card";
  const top = document.createElement("div");
  top.className = "row";
  const name = document.createElement("strong");
  name.textContent = p.author_name || p.author_handle;
  const handle = document.createElement("span");
  handle.className = "handle";
  handle.textContent = "@" + p.author_handle;
  top.append(name, handle);
  const when = document.createElement("div");
  when.className = "handle";
  when.textContent = "Posted " + (p.created_at ? new Date(p.created_at).toLocaleString() : "unknown time");
  const text = document.createElement("p");
  text.className = "text";
  text.textContent = p.text;
  d.append(top, when, text);
  if (p.url) {
    const actions = document.createElement("div");
    actions.className = "actions";
    const a = document.createElement("a");
    a.href = p.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = "Open original post";
    actions.append(a);
    d.append(actions);
  }
  return d;
}

async function run(reset) {
  const q = $("#q").value.trim();
  if (!q) { $("#status").textContent = "Type a phrase first."; return; }
  if (reset) { cursor = null; count = 0; $("#results").replaceChildren(); }
  $("#status").textContent = "Searching...";
  const r = await searchPosts(q, { cursor: cursor });
  if (!r.ok) {
    $("#status").textContent = "FAILED (" + r.kind + "): " + r.message;
    $("#more").disabled = true;
    return;
  }
  r.posts.forEach((p) => $("#results").append(card(p)));
  count += r.posts.length;
  cursor = r.cursor;
  $("#more").disabled = !cursor;
  $("#status").textContent = "OK: showing " + count + " posts" + (r.hits != null ? " (Bluesky reports about " + r.hits + " matches)" : "") + ".";
}

$("#go").addEventListener("click", () => run(true));
$("#more").addEventListener("click", () => run(false));
</script>
</body>
</html>
